# ==============================================================================
# TENANT TEMPLATE: documents (Paperless-ngx)
#
# Self-contained per-tenant stack: own Postgres, own Redis, own data dirs.
# No shared state with other tenants and no coupling to the internal
# traefik/keycloak mesh — customers get their own auth and their own origin.
#
# Published on 127.0.0.1 only. TLS is terminated by the shared edge proxy;
# ops/tenant-provision.sh prints the proxy snippet to add.
#
# Provenance: adapted from stacks/documents (running in production).
# ==============================================================================
services:
  postgres:
    image: ghcr.io/wyattau/evergreenimageregistry/postgres:${POSTGRES_VERSION}
    container_name: ${TENANT}-documents-postgres
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    volumes:
    - ${TENANT_DATA_DIR}/postgres:/var/lib/postgresql/data
    environment:
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_INITDB_ARGS=--data-checksums
    labels:
    - sis.tenant=${TENANT}
    - sis.service=documents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: ghcr.io/wyattau/evergreenimageregistry/redis:${REDIS_VERSION}
    container_name: ${TENANT}-documents-redis
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    command:
    - sh
    - -c
    - redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
    - ${TENANT_DATA_DIR}/redis:/data
    labels:
    - sis.tenant=${TENANT}
    - sis.service=documents
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  gotenberg:
    image: ghcr.io/wyattau/evergreenimageregistry/paperless-ngx-gotenberg:${GOTENBERG_VERSION}
    container_name: ${TENANT}-documents-gotenberg
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - ${TENANT_DATA_DIR}/gotenberg:/data
    labels:
    - sis.tenant=${TENANT}
    - sis.service=documents
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 150
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  tika:
    image: ghcr.io/wyattau/evergreenimageregistry/paperless-ngx-tika:${TIKA_VERSION}
    container_name: ${TENANT}-documents-tika
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - ${TENANT_DATA_DIR}/tika:/data
    labels:
    - sis.tenant=${TENANT}
    - sis.service=documents
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9998/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 150
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  paperless:
    image: ghcr.io/wyattau/evergreenimageregistry/paperless-ngx:${PAPERLESS_VERSION}
    container_name: ${TENANT}-documents-webserver
    restart: unless-stopped
    # init:true intentionally omitted — paperless uses s6-overlay which must be PID 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    ports:
    - "127.0.0.1:${APP_PORT}:8000"
    volumes:
    - ${TENANT_DATA_DIR}/paperless/data:/config
    - ${TENANT_DATA_DIR}/paperless/media:/data
    - ${TENANT_DATA_DIR}/paperless/export:/export
    environment:
    - USERMAP_UID=${PUID}
    - USERMAP_GID=${PGID}
    - PAPERLESS_URL=https://${DOMAIN}
    - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
    - PAPERLESS_DBHOST=postgres
    - PAPERLESS_DBUSER=${POSTGRES_USER}
    - PAPERLESS_DBPASS=${POSTGRES_PASSWORD}
    - PAPERLESS_DBNAME=${POSTGRES_DB}
    - PAPERLESS_REDIS=redis://:${REDIS_PASSWORD}@redis:6379
    - PAPERLESS_TIME_ZONE=${TZ}
    - PAPERLESS_OCR_LANGUAGE=${OCR_LANGUAGE}
    - PAPERLESS_OCR_MODE=force
    - PAPERLESS_ENABLE_METRICS=true
    - PAPERLESS_ADMIN_USER=${ADMIN_USER}
    - PAPERLESS_ADMIN_PASSWORD=${ADMIN_PASSWORD}
    labels:
    - sis.tenant=${TENANT}
    - sis.service=documents
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fSs http://127.0.0.1:8000 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 200
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
