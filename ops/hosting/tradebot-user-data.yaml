#cloud-config
hostname: tradebot
manage_etc_hosts: true
timezone: Europe/London
users:
  - name: wyatt
    groups: [adm, sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMC3678uXVDuIF1H534emyZuDcopGXGl9kOjP3beA6vb terraform-provider@hosting01
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINavqi0oS6M+feHsUnK7CON69+a+fqeCbYcZ+zhEormL wyatt@cachyos
ssh_pwauth: false
package_update: true
packages:
  - qemu-guest-agent
  - cloud-guest-utils
  - docker.io
  - docker-compose-v2
  - ufw
write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
runcmd:
  - systemctl enable --now qemu-guest-agent
  - systemctl enable --now docker
  # Key slot: venue API keys live here, 0600, read at spawn. Never commit
  # these to any repo (SIS is public).
  - install -d -m 700 -o wyatt -g wyatt /home/wyatt/keys
  # Firewall: deny all inbound except SSH from the LAN; outbound unrestricted.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow from 192.168.0.0/24 to any port 22 proto tcp
  - ufw --force enable
  - echo "tradebot cloud-init complete" > /var/log/cloud-init-runcmd.done
