[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = false
host_key_checking = False
timeout = 30
stdout_callback = default
# Research loop iter 39: stop the per-task interpreter discovery chatter.
interpreter_python = auto_silent

[connection]
# Research loop iter 39: pipelining executes modules without staging a
# temp file per task - one fewer SSH round trip per task, across ~24
# stacks per deploy (Ansible docs: "very significant performance
# improvement"). Safe on modern Ubuntu (no requiretty in sudoers);
# silently disabled if ANSIBLE_KEEP_REMOTE_FILES is ever set.
pipelining = True
