---
# Variables for the hosting_docker_host role.

hosting_admin_user: wyatt

# Paths on docker01
hosting_opt_dir: /opt/sis-hosting
hosting_bin_dir: "{{ hosting_opt_dir }}/bin"
hosting_env_dir: /etc/sis-hosting
hosting_repo_root: "{{ playbook_dir }}/../.."  # SIS repo on the control node

# Secrets: decrypted from SOPS to this path on the target (0600 root).
# Expected keys (see secrets/hosting.env.example):
#   RESTIC_PASSWORD, B2_BUCKET, B2_ENDPOINT, B2_ACCESS_KEY_ID,
#   B2_SECRET_ACCESS_KEY, NTFY_TOPIC
hosting_secret_env_src: "{{ playbook_dir }}/../../secrets/hosting.env.encrypted"
hosting_secret_env_dest: "{{ hosting_env_dir }}/hosting.env"

# Docker daemon tuning
hosting_docker_log_max_size: 10m
hosting_docker_log_max_files: 3

# Daemon-level user namespace remapping: container root becomes an
# unprivileged high UID on the host (dockremap, 231072:65536). This is the
# systemic containment for tenant containers — including upstream images
# that legitimately start as root and drop privileges at runtime (see
# .docs/eir-non-root-audit.md). Enable BEFORE first boot of any tenant:
# existing image/volume layers are masked once enabled.
# NOTE: containers needing host networking or the docker socket
# (node-exporter, cadvisor, docker-socket-proxy-class) must set
# `userns_mode: host` explicitly — compose templates get this for free
# when they declare it.
hosting_docker_userns_remap: true

# Control-plane unit sandboxing (research loop iter 15): Landlock-based
# fs-type deny lists on the estate's host units (RestrictFileSystems=,
# systemd 253+; kernel Landlock is default-enabled on Ubuntu 24.04+).
# Denies remote/FUSE filesystem classes the units never touch — an escape
# that mounts or reaches an NFS/CIFS/FUSE mount finds it blocked by the
# kernel LSM, not by trust. Flip off if a unit ever legitimately needs a
# networked filesystem.
hosting_unit_landlock_hardening: true

# Daemon-wide container hardening (research loop iter 31):
#   no-new-privileges — setuid/setgid escalation blocked by default in
#   every container (per-service compose settings still win).
#   live-restore — dockerd restarts/upgrades leave containers running
#   (patch releases only per Docker docs; major YY.MM upgrades and
#   daemon-option changes can still require a manual container stop).
#   First enable still costs one daemon restart.
hosting_docker_live_restore: true

# The internal tenant bridge is 10.10.10.0/24 — keep Docker's own pools
# well clear of it and of the data_net ranges used on TrueNAS.
hosting_docker_address_pools:
  - base: 172.20.0.0/14
    size: 20
  - base: 172.26.0.0/15
    size: 24

# IPv6 tenant pools (research loop iter 18): the fence's v6 source set.
# fd00::/8 covers every ULA Docker auto-assigns when IPv6 networking is
# enabled; the fence drops tenant ULA -> ULA/link-local. No v6 networks
# exist today, so the rule is inert until then — this default exists so
# that enabling v6 can never silently bypass the fence.
hosting_docker_address_pools_v6:
  - base: fd00::/8
    size: 64
    size: 22

# SSH hardening: management interface only sees key auth (cloud-init sets
# ssh_pwauth false; this belt-and-braces the running config).
hosting_fail2ban_bantime: 1h
hosting_fail2ban_findtime: 10m
hosting_fail2ban_maxretry: 5

# Ports the edge proxy serves. 80/443 open; SSH restricted to the mgmt
# bridge network in nftables; everything else inbound dropped.
hosting_public_tcp_ports:
  - 80
  - 443

# Where the control-plane binary comes from. Build with
#   (cd hosting-api && cargo build --release)
# on the control node, or point at a CI artifact.
hosting_api_binary_src: "{{ playbook_dir }}/../../../hosting-api/target/release/hosting-api"

# Dashboard artifact: a directory containing dist/ + node_modules/
# (production only) + package.json. Build on the control node with
#   (cd hosting-dashboard && bun install && bun run build)
hosting_dashboard_dist_src: "{{ playbook_dir }}/../../../hosting-dashboard"

# Managed by this role; anything else on the host is out of scope.
hosting_node_exporter_version: v1.11.1
hosting_cadvisor_version: v0.57.0

# Secrets at rest (research loop iter 5): when true, the SOPS-decrypted
# platform secrets are sealed with `systemd-creds encrypt` (TPM2-bound when
# the VM has a vTPM) and units decrypt them into a tmpfs RuntimeDirectory at
# start - no plaintext secrets at rest on the tenant-facing host. Requires
# systemd >= 250 (Ubuntu 24.04: 255) and, for TPM binding, a vTPM device
# (PVE: add via VM hardware before first boot; rehearse in DR drill).
hosting_secrets_tpm_creds: false
