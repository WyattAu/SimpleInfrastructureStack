---
# Handlers for the hosting_docker_host role.

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Reload nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Apply sysctls
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart hosting-api
  ansible.builtin.systemd:
    name: sis-hosting-api
    state: restarted
