---
# ===================================================================
# hosting_docker_host — turn docker01 into the tenant platform host
# ===================================================================
# Idempotent: safe to re-run at any time. Order matters — packages and
# mounts first, security baseline second, platform tooling last.
#
# What this role deliberately does NOT do:
#   - Tenant provisioning (ops/tenant-provision.sh, run per tenant)
#   - Edge routing (roles/hosting_edge)
#   - Anything on the Proxmox node itself (runbook: .docs/hosting-architecture.md)

# --- 1. Base system ---------------------------------------------------------

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - rsync
      - restic
      - nftables
      - fail2ban
      - unattended-upgrades
      - qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable the QEMU guest agent (IP reporting for PVE)
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

# --- 2. Docker (official repo, not distro packages) --------------------------

- name: Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Userns-remap — ensure the dockremap service account exists
  # Research loop iter 29 (2026-11-23): the daemon would create this on
  # restart, but the verification task below ran BEFORE handlers fired, so
  # the first real bootstrap always failed here.
  ansible.builtin.user:
    name: dockremap
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    comment: "docker userns-remap"
  when: hosting_docker_userns_remap | bool

- name: Userns-remap — check for existing dockremap subordinate UID ranges
  ansible.builtin.command: grep -q '^dockremap:' /etc/subuid
  register: hosting_dockremap_subuid
  changed_when: false
  failed_when: hosting_dockremap_subuid.rc not in [0, 1]
  when: hosting_docker_userns_remap | bool

- name: Userns-remap — allocate dockremap subordinate UID/GID ranges
  # `useradd -r` (system account) does NOT allocate subids on Ubuntu, so
  # this must be explicit. usermod appends, hence the guard above.
  ansible.builtin.command: >-
    usermod --add-subuids 100000-165535 --add-subgids 100000-165535 dockremap
  changed_when: true
  when:
    - hosting_docker_userns_remap | bool
    - hosting_dockremap_subuid.rc != 0

- name: Docker daemon configuration (log rotation, address pools, userns-remap, hardening)
  # Research loop iter 31: built as a DICT then to_nice_json. The previous
  # string-concatenation template rendered `],` + `,"userns-remap"` — a
  # double comma, i.e. INVALID JSON, which would have failed dockerd at
  # first bootstrap (found by render-validation before the EPYC bring-up).
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ daemon_config | to_nice_json }}"
  vars:
    daemon_base:
      log-driver: json-file
      log-opts:
        max-size: "{{ hosting_docker_log_max_size }}"
        # |string: dockerd wants a JSON string, not a number
        max-file: "{{ hosting_docker_log_max_files | string }}"
      default-address-pools: "{{ hosting_docker_address_pools }}"
      no-new-privileges: true
      live-restore: "{{ hosting_docker_live_restore | bool }}"
    daemon_config: >-
      {{ daemon_base
         | combine({'userns-remap': 'default'} if (hosting_docker_userns_remap | bool) else {}) }}
  notify: Restart docker

- name: Apply the Docker restart before verifying userns-remap state
  ansible.builtin.meta: flush_handlers
  when: hosting_docker_userns_remap | bool

- name: Read the subordinate ID maps from the guest
  # NOTE: lookup('file', ...) resolves on the CONTROLLER. The original
  # assertion therefore tested the workstation's /etc/subuid and could
  # never pass on a correct guest. slurp reads the remote file.
  ansible.builtin.slurp:
    src: "/etc/{{ item }}"
  loop:
    - subuid
    - subgid
  register: hosting_subid_maps
  when: hosting_docker_userns_remap | bool

- name: Verify the dockremap subordinate ranges exist
  ansible.builtin.assert:
    that:
      - "'dockremap' in (hosting_subid_maps.results | map(attribute='content') | map('b64decode') | join('\n'))"
    fail_msg: >-
      /etc/subuid or /etc/subgid lacks a dockremap entry after enabling
      userns-remap — the dockremap account and range tasks should have
      created it; check both ran.
  when: hosting_docker_userns_remap | bool

- name: Admin user in the docker group
  ansible.builtin.user:
    name: "{{ hosting_admin_user }}"
    groups: docker
    append: true

- name: Docker enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# --- 3. Data disk -------------------------------------------------------------

- name: Locate the tenant data disk
  # docker02 (staging) has no data disk: everything lives on the root
  # disk and is disposable. An empty hosting_data_disk_by_id skips the
  # whole disk block below.
  ansible.builtin.stat:
    path: "/dev/disk/by-id/{{ hosting_data_disk_by_id }}"
  register: hosting_data_disk
  when: hosting_data_disk_by_id | length > 0

- name: Assert the data disk exists
  ansible.builtin.assert:
    that: hosting_data_disk.stat.exists
    fail_msg: >-
      /dev/disk/by-id/{{ hosting_data_disk_by_id }} not found — set
      hosting_data_disk_by_id to the scsi1 disk's by-id name
      (`ls -l /dev/disk/by-id/`).
  when: hosting_data_disk_by_id | length > 0

- name: Filesystem on the data disk (created once, never reformatted)
  community.general.filesystem:
    dev: "/dev/disk/by-id/{{ hosting_data_disk_by_id }}"
    fstype: ext4
    state: present
  when: hosting_data_disk_by_id | length > 0

# Per-tenant DISK quotas (research loop iter 9) are DEFERRED (iter 29,
# 2026-11-23): ext4's internal `quota` feature fails to mount on this
# guest kernel — "ext4_enable_quotas ... err=-3" then mount(2) ESRCH,
# even when the inodes are initialized by mkfs (verified empirically:
# mkfs -O project,quota, tune2fs -O quota -Q prjquota, and e2fsck -f all
# still fail). `project` requires `quota`, so tenant directory quotas
# cannot ship until either (a) the kernel bug is fixed/resolved by an
# external-aquota (usrjquota/jqfmt=vfsv1) setup, or (b) tenants move to
# per-tenant ZFS datasets — the documented growth path. Backlog entry
# tracks it; until then a runaway tenant is contained only by its
# container limits.
- name: Strip the default quota feature from the data disk
  # e2fsprogs 1.47 (Ubuntu 24.04) enables `quota` in mkfs defaults; with
  # the bug above that makes EVERY mount of the data disk fail. Also
  # normalizes disks provisioned before this fix. One-way, safe.
  ansible.builtin.command:
    cmd: "tune2fs -O ^quota /dev/disk/by-id/{{ hosting_data_disk_by_id }}"
  register: hosting_project_quota
  changed_when: "'must be run' not in hosting_project_quota.stderr"
  failed_when: >-
    hosting_project_quota.rc != 0 and
    'The filesystem already' not in hosting_project_quota.stderr and
    'is set' not in hosting_project_quota.stderr
  when: hosting_data_disk_by_id | length > 0

- name: Verify the quota feature is off (a mount-blocking defect if not)
  ansible.builtin.command: >-
    dumpe2fs -h /dev/disk/by-id/{{ hosting_data_disk_by_id }}
  register: hosting_data_fs_features
  changed_when: false
  failed_when: "' quota' in hosting_data_fs_features.stdout"
  when: hosting_data_disk_by_id | length > 0

- name: Runtime dependencies (node for the dashboard service)
  # Iter 29: the dashboard unit execs /usr/bin/node but nothing installed
  # it — first bootstrap would have systemd-failed sis-hosting-dashboard
  # immediately after a green playbook run. Ubuntu 24.04 nodejs = 18.x,
  # current enough for the Astro server output.
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Mount points under {{ hosting_data_mount }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ hosting_data_mount }}/tenants"
    - "{{ hosting_data_mount }}/backups/restic"
    - "{{ hosting_data_mount }}/backups/staging"
    - "{{ hosting_env_dir }}"

- name: Read the data disk UUID
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value /dev/disk/by-id/{{ hosting_data_disk_by_id }}"
  register: hosting_data_disk_uuid
  changed_when: false
  when: hosting_data_disk_by_id | length > 0

- name: Mount the data disk at {{ hosting_data_mount }}
  ansible.posix.mount:
    path: "{{ hosting_data_mount }}"
    src: "UUID={{ hosting_data_disk_uuid.stdout }}"
    fstype: ext4
    # prjquota would fail to mount while the quota feature is stripped
    # (iter 29); re-add it together with the feature when quotas ship.
    opts: defaults,noatime
    state: mounted
  when: hosting_data_disk_by_id | length > 0

- name: Platform directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ hosting_opt_dir }}"
    - "{{ hosting_bin_dir }}"

# --- 4. Secrets ---------------------------------------------------------------

- name: Install decrypted platform secrets (from SOPS)
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', hosting_secret_env_src) }}"
    dest: "{{ hosting_secret_env_dest }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not (hosting_secrets_tpm_creds | bool)

# Research loop iter 5: TPM-bound secret at rest. SOPS decrypts inside the
# ansible controller and pipes straight into systemd-creds on the host - the
# plaintext never touches the host disk; at rest it is ciphertext bound to
# this machine's TPM2 (or the host fallback key when no vTPM exists).
- name: Seal platform secrets with systemd-creds (TPM2-bound)
  ansible.builtin.shell: |
    set -o pipefail
    {{ lookup('community.sops.sops', hosting_secret_env_src) }} \
      | systemd-creds encrypt --name=hosting.env \
          {% if hosting_secrets_tpm | default(true) %}--with-key=tpm2 {% endif %} \
          - {{ hosting_env_dir }}/hosting.env.cred
    chmod 0600 {{ hosting_env_dir }}/hosting.env.cred
    rm -f {{ hosting_env_dir }}/hosting.env
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
  when: hosting_secrets_tpm_creds | bool

# --- 5. Security baseline ------------------------------------------------------

- name: Nftables baseline
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    mode: "0644"
    content: "{{ lookup('template', 'nftables.conf.j2') }}"
  notify: Reload nftables

- name: Nftables enabled
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Fail2ban jail (sshd)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    content: "{{ lookup('template', 'fail2ban.jail.local.j2') }}"
  notify: Restart fail2ban

- name: Fail2ban enabled
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Kernel tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-sis-hosting.conf
    mode: "0644"
    content: "{{ lookup('template', 'sysctl.90-sis-hosting.conf.j2') }}"
  notify: Apply sysctls

# --- 6. Tenant platform tooling -------------------------------------------------

- name: Install tenant tooling (provision + backup scripts)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ hosting_bin_dir }}/{{ item.name }}"
    mode: "0750"
    owner: root
    group: root
  loop:
    - name: tenant-provision.sh
      src: "{{ hosting_repo_root }}/ops/tenant-provision.sh"
    - name: tenant-backup.sh
      src: "{{ hosting_repo_root }}/ops/tenant-backup.sh"

- name: Install tenant service templates
  # Iteration 29: the provisioner died with "no template 'files'.
  # Available: (empty)" — the role shipped the script but never the
  # template tree it reads. Landed at ../tenants/templates relative to
  # the bin dir, which the provisioner resolves.
  ansible.builtin.copy:
    src: "{{ hosting_repo_root }}/ops/tenants/templates/"
    dest: "{{ hosting_opt_dir }}/tenants/templates/"
    mode: "0644"
    directory_mode: "0755"
    owner: root
    group: root

- name: Tenant tooling environment (TENANT_ROOT and friends)
  ansible.builtin.copy:
    dest: "{{ hosting_env_dir }}/env"
    mode: "0644"
    content: |
      TENANT_ROOT=/srv/tenants
      BACKUP_BASE_PATH=/srv/backups
      RESTIC_PASSWORD_FILE={{ hosting_env_dir }}/restic-password
      RESTIC_REPOSITORY={{ hosting_backup_local_repo }}

- name: Extract the restic password from platform secrets
  # Iter 29: the previous `lookup('pipe', '. /etc/sis-hosting/...')`
  # sourced the file on the CONTROL node, where it never exists (it
  # lives on the guest, and is sealed + removed there). Source from the
  # same controller-side sops lookup the env file itself uses.
  ansible.builtin.copy:
    dest: "{{ hosting_env_dir }}/restic-password"
    mode: "0600"
    content: >-
      {{ lookup('community.sops.sops', hosting_secret_env_src)
         | regex_findall('^RESTIC_PASSWORD=(.*)$', multiline=true) | first }}
  no_log: true

- name: Nightly tenant backup runner
  ansible.builtin.copy:
    dest: "{{ hosting_bin_dir }}/tenant-backup-all.sh"
    mode: "0750"
    content: "{{ lookup('template', 'tenant-backup-all.sh.j2') }}"

- name: Systemd units (backup + watchdog)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    content: "{{ lookup('template', item + '.j2') }}"
  loop:
    - sis-hosting-tenant-backup.service
    - sis-hosting-tenant-backup.timer
    - sis-hosting-watchdog.service
    - sis-hosting-watchdog.timer
  notify: Reload systemd

- name: Enable watchdog timer (backup sweep lives inside hosting-api now)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - sis-hosting-watchdog.timer

- name: Disable the shell backup timer (superseded by hosting-api cron)
  ansible.builtin.systemd:
    name: sis-hosting-tenant-backup.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Watchdog script
  ansible.builtin.copy:
    dest: "{{ hosting_bin_dir }}/watchdog.sh"
    mode: "0750"
    content: "{{ lookup('template', 'watchdog.sh.j2') }}"

- name: Install hosting-api binary
  ansible.builtin.copy:
    src: "{{ hosting_api_binary_src }}"
    dest: "{{ hosting_bin_dir }}/hosting-api"
    mode: "0755"
    owner: root
    group: root
  notify: Restart hosting-api

- name: Install the dashboard build artifact (dist + production deps)
  # rsync, not `copy`: the artifact is ~230 MiB with node_modules and
  # ansible's copy streams it through the controller's connection — slow
  # enough to hit playbook timeouts mid-transfer (iteration 29), leaving
  # a truncated tree and a crash-looping unit. synchronize resumes and is
  # idempotent; delete keeps stale chunks from previous builds out.
  # Trailing slash semantics: contents land in dest directly.
  # (community.general.rsync no longer exists in 13.x — synchronize is
  # the supported form.)
  ansible.posix.synchronize:
    src: "{{ hosting_dashboard_dist_src }}/"
    dest: "{{ hosting_opt_dir }}/dashboard/"
    archive: true
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.astro"
  notify: Restart hosting-dashboard

- name: Systemd unit (hosting-dashboard)
  ansible.builtin.copy:
    dest: /etc/systemd/system/sis-hosting-dashboard.service
    mode: "0644"
    content: "{{ lookup('template', 'sis-hosting-dashboard.service.j2') }}"
  notify: Reload systemd

- name: Enable hosting-dashboard service
  ansible.builtin.systemd:
    name: sis-hosting-dashboard
    enabled: true
    state: started
    daemon_reload: true

- name: Systemd unit (hosting-api)
  ansible.builtin.copy:
    dest: /etc/systemd/system/sis-hosting-api.service
    mode: "0644"
    content: "{{ lookup('template', 'sis-hosting-api.service.j2') }}"
  notify: Reload systemd

- name: Enable hosting-api service
  ansible.builtin.systemd:
    name: sis-hosting-api
    enabled: true
    state: started
    daemon_reload: true

# --- 7. Host-level monitoring exporters -------------------------------------------

- name: Node exporter
  # Iteration 29 correction: `network_mode: host` + `pid_mode: host` are
  # INCOMPATIBLE with the daemon's userns-remap (docker rejects the
  # container: "cannot share the host's network namespace when user
  # namespaces are enabled"). Bridge networking + published port instead;
  # host metrics still come from the /host rootfs bind (node-exporter
  # reads /proc and /sys through it, and netdev counters come from
  # host sysfs), so the numbers the monitoring stack scrapes are the
  # host's, not the container's.
  community.docker.docker_container:
    name: hosting-node-exporter
    image: "ghcr.io/wyattau/evergreenimageregistry/node-exporter:{{ hosting_node_exporter_version }}"
    restart_policy: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    comparisons:
      image: ignore  # pin via defaults, don't rebuild on every run
  tags: [monitoring]

- name: Container advisor (cAdvisor, per-tenant metrics)
  # Iteration 29 correction: `privileged: true` is rejected outright when
  # the daemon runs userns-remap ("privileged mode is incompatible with
  # user namespaces"). Unprivileged form instead: the docker.sock bind
  # (ro) drives container discovery/stats and /sys,/rootfs cover the
  # cgroup+sysfs reads; /dev/kmsg stays exposed for OOM events. If a
  # future driver genuinely needs host-level access, the answer is a
  # dedicated non-remapped daemon or a host systemd unit — NOT turning
  # userns off for everyone.
  community.docker.docker_container:
    name: hosting-cadvisor
    image: "ghcr.io/wyattau/evergreenimageregistry/cadvisor:{{ hosting_cadvisor_version }}"
    restart_policy: unless-stopped
    ports:
      # loopback-only would hide cAdvisor from the NAS monitoring stack
      # (iteration 29); exposure is gated by the guests' nftables input
      # chain, which allows 8081 only from the mgmt segments.
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      # Research loop iter 6: collect only what we bill or alert on
      # (cpu, memory, network, diskIO, oom_event). referenced_memory is
      # disabled because cAdvisor's own docs flag it as intrusive - it
      # perturbs kernel page reclaim to measure working-set size.
      # (iter 29: `numa` dropped — this cAdvisor build rejects it as
      # unsupported and exits to usage text.)
      - --disable_metrics=percpu,referenced_memory,udp,tcp,advtcp,cpuLoad,hugetlb,disk,process
  tags: [monitoring]
