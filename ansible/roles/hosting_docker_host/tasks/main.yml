---
# ===================================================================
# hosting_docker_host — turn docker01 into the tenant platform host
# ===================================================================
# Idempotent: safe to re-run at any time. Order matters — packages and
# mounts first, security baseline second, platform tooling last.
#
# What this role deliberately does NOT do:
#   - Tenant provisioning (ops/tenant-provision.sh, run per tenant)
#   - Edge routing (roles/hosting_edge)
#   - Anything on the Proxmox node itself (runbook: .docs/hosting-architecture.md)

# --- 1. Base system ---------------------------------------------------------

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - rsync
      - restic
      - nftables
      - fail2ban
      - unattended-upgrades
      - qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable the QEMU guest agent (IP reporting for PVE)
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

# --- 2. Docker (official repo, not distro packages) --------------------------

- name: Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker daemon configuration (log rotation, address pools, userns-remap)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "{{ hosting_docker_log_max_size }}", "max-file": "{{ hosting_docker_log_max_files }}" },
        "default-address-pools": {{ hosting_docker_address_pools | to_nice_json }}{{ ',' if hosting_docker_userns_remap else '' }}
      {% if hosting_docker_userns_remap %}
        ,"userns-remap": "default"
      {% endif %}
      }
  notify: Restart docker

- name: Verify the dockremap subordinate ranges exist
  ansible.builtin.assert:
    that:
      - lookup('file', '/etc/subuid') is search('dockremap')
      - lookup('file', '/etc/subgid') is search('dockremap')
    fail_msg: >-
      /etc/subuid or /etc/subgid lacks a dockremap entry after enabling
      userns-remap — docker creates it on restart; if this fires, check
      that the daemon restarted successfully.
  when: hosting_docker_userns_remap | bool

- name: Admin user in the docker group
  ansible.builtin.user:
    name: "{{ hosting_admin_user }}"
    groups: docker
    append: true

- name: Docker enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# --- 3. Data disk -------------------------------------------------------------

- name: Locate the tenant data disk
  ansible.builtin.stat:
    path: "/dev/disk/by-id/{{ hosting_data_disk_by_id }}"
  register: hosting_data_disk

- name: Assert the data disk exists
  ansible.builtin.assert:
    that: hosting_data_disk.stat.exists
    fail_msg: >-
      /dev/disk/by-id/{{ hosting_data_disk_by_id }} not found — set
      hosting_data_disk_by_id to the scsi1 disk's by-id name
      (`ls -l /dev/disk/by-id/`).

- name: Filesystem on the data disk (created once, never reformatted)
  community.general.filesystem:
    dev: "/dev/disk/by-id/{{ hosting_data_disk_by_id }}"
    fstype: ext4
    state: present

# Research loop iter 9: per-tenant DISK quotas via ext4 project quotas -
# the storage noisy-neighbor fix without changing filesystems (the spec's
# ext4 decision stands; ZFS-in-guest remains the documented growth path).
# Project feature enablement is one-way on ext4 (harmless if quotas are
# never set).
- name: Enable ext4 project quota feature on the data disk
  ansible.builtin.command:
    cmd: "tune2fs -O project,quota /dev/disk/by-id/{{ hosting_data_disk_by_id }}"
  register: hosting_project_quota
  changed_when: "'must be run' not in hosting_project_quota.stderr"
  failed_when: >-
    hosting_project_quota.rc != 0 and
    'The filesystem already' not in hosting_project_quota.stderr and
    'is set' not in hosting_project_quota.stderr

- name: Quota tooling (project quota administration)
  ansible.builtin.apt:
    name:
      - quota
      - xfsprogs   # xfs_quota administers ext4 project quotas via netlink
    state: present

- name: Mount points under {{ hosting_data_mount }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ hosting_data_mount }}/tenants"
    - "{{ hosting_data_mount }}/backups/restic"
    - "{{ hosting_data_mount }}/backups/staging"
    - "{{ hosting_env_dir }}"

- name: Read the data disk UUID
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value /dev/disk/by-id/{{ hosting_data_disk_by_id }}"
  register: hosting_data_disk_uuid
  changed_when: false

- name: Mount the data disk at {{ hosting_data_mount }}
  ansible.posix.mount:
    path: "{{ hosting_data_mount }}"
    src: "UUID={{ hosting_data_disk_uuid.stdout }}"
    fstype: ext4
    opts: defaults,noatime,prjquota
    state: mounted

- name: Platform directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ hosting_opt_dir }}"
    - "{{ hosting_bin_dir }}"

# --- 4. Secrets ---------------------------------------------------------------

- name: Install decrypted platform secrets (from SOPS)
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', hosting_secret_env_src) }}"
    dest: "{{ hosting_secret_env_dest }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not (hosting_secrets_tpm_creds | bool)

# Research loop iter 5: TPM-bound secret at rest. SOPS decrypts inside the
# ansible controller and pipes straight into systemd-creds on the host - the
# plaintext never touches the host disk; at rest it is ciphertext bound to
# this machine's TPM2 (or the host fallback key when no vTPM exists).
- name: Seal platform secrets with systemd-creds (TPM2-bound)
  ansible.builtin.shell: |
    set -o pipefail
    {{ lookup('community.sops.sops', hosting_secret_env_src) }} \
      | systemd-creds encrypt --name=hosting.env \
          {% if hosting_secrets_tpm | default(true) %}--with-key=tpm2 {% endif %} \
          - {{ hosting_env_dir }}/hosting.env.cred
    chmod 0600 {{ hosting_env_dir }}/hosting.env.cred
    rm -f {{ hosting_env_dir }}/hosting.env
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
  when: hosting_secrets_tpm_creds | bool

# --- 5. Security baseline ------------------------------------------------------

- name: Nftables baseline
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    mode: "0644"
    content: "{{ lookup('template', 'nftables.conf.j2') }}"
  notify: Reload nftables

- name: Nftables enabled
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Fail2ban jail (sshd)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    content: "{{ lookup('template', 'fail2ban.jail.local.j2') }}"
  notify: Restart fail2ban

- name: Fail2ban enabled
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Kernel tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-sis-hosting.conf
    mode: "0644"
    content: "{{ lookup('template', 'sysctl.90-sis-hosting.conf.j2') }}"
  notify: Apply sysctls

# --- 6. Tenant platform tooling -------------------------------------------------

- name: Install tenant tooling (provision + backup scripts)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ hosting_bin_dir }}/{{ item.name }}"
    mode: "0750"
    owner: root
    group: root
  loop:
    - name: tenant-provision.sh
      src: "{{ hosting_repo_root }}/ops/tenant-provision.sh"
    - name: tenant-backup.sh
      src: "{{ hosting_repo_root }}/ops/tenant-backup.sh"

- name: Tenant tooling environment (TENANT_ROOT and friends)
  ansible.builtin.copy:
    dest: "{{ hosting_env_dir }}/env"
    mode: "0644"
    content: |
      TENANT_ROOT=/srv/tenants
      BACKUP_BASE_PATH=/srv/backups
      RESTIC_PASSWORD_FILE={{ hosting_env_dir }}/restic-password
      RESTIC_REPOSITORY={{ hosting_backup_local_repo }}

- name: Extract the restic password from platform secrets
  ansible.builtin.copy:
    dest: "{{ hosting_env_dir }}/restic-password"
    mode: "0600"
    content: >-
      {{ lookup('pipe', '. ' + hosting_secret_env_dest + ' && printf %s "$RESTIC_PASSWORD"') }}
  no_log: true

- name: Nightly tenant backup runner
  ansible.builtin.copy:
    dest: "{{ hosting_bin_dir }}/tenant-backup-all.sh"
    mode: "0750"
    content: "{{ lookup('template', 'tenant-backup-all.sh.j2') }}"

- name: Systemd units (backup + watchdog)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    content: "{{ lookup('template', item + '.j2') }}"
  loop:
    - sis-hosting-tenant-backup.service
    - sis-hosting-tenant-backup.timer
    - sis-hosting-watchdog.service
    - sis-hosting-watchdog.timer
  notify: Reload systemd

- name: Enable watchdog timer (backup sweep lives inside hosting-api now)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - sis-hosting-watchdog.timer

- name: Disable the shell backup timer (superseded by hosting-api cron)
  ansible.builtin.systemd:
    name: sis-hosting-tenant-backup.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Watchdog script
  ansible.builtin.copy:
    dest: "{{ hosting_bin_dir }}/watchdog.sh"
    mode: "0750"
    content: "{{ lookup('template', 'watchdog.sh.j2') }}"

- name: Install hosting-api binary
  ansible.builtin.copy:
    src: "{{ hosting_api_binary_src }}"
    dest: "{{ hosting_bin_dir }}/hosting-api"
    mode: "0755"
    owner: root
    group: root
  notify: Restart hosting-api

- name: Install the dashboard build artifact (dist + production deps)
  ansible.builtin.copy:
    src: "{{ hosting_dashboard_dist_src }}"
    dest: "{{ hosting_opt_dir }}/dashboard/"
    mode: "preserve"
  notify: Restart hosting-dashboard

- name: Systemd unit (hosting-dashboard)
  ansible.builtin.copy:
    dest: /etc/systemd/system/sis-hosting-dashboard.service
    mode: "0644"
    content: "{{ lookup('template', 'sis-hosting-dashboard.service.j2') }}"
  notify: Reload systemd

- name: Enable hosting-dashboard service
  ansible.builtin.systemd:
    name: sis-hosting-dashboard
    enabled: true
    state: started
    daemon_reload: true

- name: Systemd unit (hosting-api)
  ansible.builtin.copy:
    dest: /etc/systemd/system/sis-hosting-api.service
    mode: "0644"
    content: "{{ lookup('template', 'sis-hosting-api.service.j2') }}"
  notify: Reload systemd

- name: Enable hosting-api service
  ansible.builtin.systemd:
    name: sis-hosting-api
    enabled: true
    state: started
    daemon_reload: true

# --- 7. Host-level monitoring exporters -------------------------------------------

- name: Node exporter
  community.docker.docker_container:
    name: hosting-node-exporter
    image: "ghcr.io/wyattau/evergreenimageregistry/node-exporter:{{ hosting_node_exporter_version }}"
    restart_policy: unless-stopped
    network_mode: host
    pid_mode: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    comparisons:
      image: ignore  # pin via defaults, don't rebuild on every run
  tags: [monitoring]

- name: Container advisor (cAdvisor, per-tenant metrics)
  community.docker.docker_container:
    name: hosting-cadvisor
    image: "ghcr.io/wyattau/evergreenimageregistry/cadvisor:{{ hosting_cadvisor_version }}"
    restart_policy: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      # Research loop iter 6: collect only what we bill or alert on
      # (cpu, memory, network, diskIO, oom_event). referenced_memory is
      # disabled because cAdvisor's own docs flag it as intrusive - it
      # perturbs kernel page reclaim to measure working-set size.
      - --disable_metrics=percpu,referenced_memory,udp,tcp,advtcp,cpuLoad,numa,hugetlb,disk,process
  tags: [monitoring]
