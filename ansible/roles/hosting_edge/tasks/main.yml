---
# ===================================================================
# hosting_edge — Caddy as the tenant-facing edge proxy
# ===================================================================
# One Caddyfile, generated from the hosting_tenants list. TLS certs are
# obtained via Let's Encrypt HTTP-01 against the host's static IP — no
# Cloudflare dependency, no tunnel: this host is publicly addressed by
# design (business premises broadband).
#
# Why Caddy and not Traefik/vane for the pilot:
#   - Automatic certificates with zero per-tenant configuration
#   - One static file, no provider machinery, trivially auditable
#   - vane (our own edge gateway) replaces this once it is hardened for
#     multi-tenant ACME — the Caddyfile routes translate 1:1

- name: Caddy apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Caddy apt key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable-archive-keyring.asc
    mode: "0644"

- name: Caddy apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/caddy-stable-archive-keyring.asc]
      https://dl.cloudsmith.io/public/caddy/stable/debian any-version main
    filename: caddy-stable
    state: present

- name: Caddy package
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Caddyfile (per-tenant routes)
  ansible.builtin.copy:
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    content: "{{ lookup('template', 'Caddyfile.j2') }}"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload caddy

- name: Caddy enabled and running
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
