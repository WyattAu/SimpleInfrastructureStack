---
# ===================================================================
# hosting_edge — Caddy as the tenant-facing edge proxy
# ===================================================================
# One Caddyfile, generated from the hosting_tenants list. TLS certs are
# obtained via Let's Encrypt HTTP-01 against the host's static IP — no
# Cloudflare dependency, no tunnel: this host is publicly addressed by
# design (business premises broadband).
#
# Why Caddy and not Traefik/vane for the pilot:
#   - Automatic certificates with zero per-tenant configuration
#   - One static file, no provider machinery, trivially auditable
#   - vane (our own edge gateway) replaces this once it is hardened for
#     multi-tenant ACME — the Caddyfile routes translate 1:1

- name: Caddy apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Caddy apt key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable-archive-keyring.asc
    mode: "0644"

- name: Caddy apt repository
  # Iteration 29: the URL was `.../stable/debian any-version main` — not
  # a real Cloudsmith path for EITHER distro (the tree is /deb/debian and
  # /deb/ubuntu), so apt-cache update failed hard on first edge bring-up
  # and the whole apt cache update was poisoned with it.
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/caddy-stable-archive-keyring.asc]
      https://dl.cloudsmith.io/public/caddy/stable/deb/{{ ansible_distribution | lower }}
      any-version main
    filename: caddy-stable
    state: present

- name: Caddy package
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Caddy log directory (owned by the caddy user BEFORE first load)
  # Iteration 29: on first tenant bring-up the reload created
  # /var/log/caddy/smoke.access.log as ROOT (dir race during package
  # install), mode 0600 — and then EVERY reload failed with
  # "permission denied" because the running daemon could never open its
  # own log again. Asserting ownership AFTER the package install closes
  # that race (the user only exists once the package is in).
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"

- name: Caddyfile (per-tenant routes)
  ansible.builtin.copy:
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    content: "{{ lookup('template', 'Caddyfile.j2') }}"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload caddy

- name: Caddy enabled and running
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
