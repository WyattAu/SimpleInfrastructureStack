---
all:
  children:
    truenas:
      hosts:
        localhost:
          ansible_connection: local
    cachyos:
      hosts:
        192.168.1.191:
          ansible_user: wyatt
          ansible_become: true
    # Client-hosting platform (Dell R730 at hosting01).
    # docker01 has two addresses:
    #   vmbr0 (mgmt, DHCP)     192.168.0.127  <- Ansible uses this
    #   vmbr1 (tenant, static) 10.10.10.10    <- intra-node only
    #
    # The tenant address is only reachable through the Proxmox node, and
    # ProxyJump to it FAILS today: OpenSSH 10.6 negotiates
    # publickey-hostbound signatures on the forwarded connection and the
    # guest's sshd rejects them (direct connections do not use hostbound
    # and work fine). Revisit with -o PubkeyAcceptedAlgorithms tuning or
    # an older client before switching back. The mgmt lease is stable by
    # MAC; re-resolve with: qm guest cmd 110 network-get-interfaces
    hosting:
      hosts:
        # ansible_host is RESOLVED per deploy into inventory/host_vars/
        # docker0X.yml by ops/hosting/deploy.sh (guest-agent query) —
        # DHCP leases change on rebuild; committed files hold the last
        # known values so ad-hoc ansible runs work between deploys.
        docker01:
          ansible_user: wyatt
          ansible_become: true
        docker02:
          ansible_user: wyatt
          ansible_become: true
          # ansible_ssh_common_args: >-
          #   -o ProxyJump={{ hosting_pve_jump_host }}
