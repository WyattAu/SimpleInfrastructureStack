---
all:
  children:
    truenas:
      hosts:
        localhost:
          ansible_connection: local
    cachyos:
      hosts:
        192.168.1.191:
          ansible_user: wyatt
          ansible_become: true
    # Client-hosting platform (EPYC node at business premises).
    # docker01 sits on the internal tenant bridge, which is only
    # reachable through the Proxmox node — hence the ProxyJump.
    hosting:
      hosts:
        docker01:
          ansible_host: 10.10.10.10
          ansible_user: wyatt
          ansible_become: true
          ansible_ssh_common_args: >-
            -o ProxyJump={{ hosting_pve_jump_host }}
